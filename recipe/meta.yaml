{% set name = "pandera" %}
{% set version = "0.34.1" %}

package:
  name: pandera-suite
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 8907a976403757c5e05a73022d4c447c74844d01c6053667b9a2ca63f26c2fa6

build:
  number: 0
  skip: true  # [py<310]

outputs:
  - name: pandera-base
    build:
      script:
        - python -m pip install . --no-deps --no-build-isolation -vv
      entry_points:
        - pandera = pandera.cli:main

    requirements:
      host:
        - python
        - pip
        - wheel
        - setuptools >=61.0
        - setuptools-scm
      run:
        - python
        - packaging >=20.0
        - pydantic
        - typeguard
        - typing_extensions
        - typing_inspect >=0.6.0
      run_constrained:
        # cli
        - typer >=0.12.3
        - pyyaml >=5.1
        # pandas
        - numpy >=1.24.4
        - pandas >=2.1.1
        # strategies
        - hypothesis >=6.92.7
        # io
        #- pyyaml >=5.1
        # frictionless
        - frictionless <=4.40.8
        # mypy
        - scipy-stubs  # [py>=3.10]
        # pyspark
        # pyspark[connect] >= 3.2.0
        - pyspark >=3.2.0
        - grpcio >=1.56.0
        - grpcio-status >=1.56.0
        - googleapis-common-protos >=1.56.4
        # ibis
        - ibis-framework >=9.0.0
        # polars
        - polars >=1.20.0
        # xarray
        - xarray >=2024.10.0
        #- numpy >=1.24.4
        # narwhals
        - narwhals >=1.26.0
        # pyarrow
        - pyarrow >=13
        #- narwhals >=1.26.0

    test:
      requires:
        - pip
      imports:
        - pandera
      commands:
        - pip check

  - name: pandera
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
    test:
      requires:
        - pip
      imports:
        - pandera
      commands:
        - pip check

  - name: pandera-strategies
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - hypothesis
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.strategies
      commands:
        - pip check

  - name: pandera-hypotheses
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - scipy
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.api.hypotheses
      commands:
        - pip check

  - name: pandera-io
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - pyyaml
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.io
      commands:
        - pip check

  - name: pandera-pyspark
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - pyspark
        - pandas
        - pyarrow
        - grpcio
        - grpcio-status
        - googleapis-common-protos
        - numpy
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.accessors.pyspark_accessor
        - pandera.typing.pyspark
      commands:
        - pip check

  - name: pandera-modin
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - modin
        # this one is a superset of both pandera-modin-ray and pandera-modin-dask packages
        - {{ pin_subpackage('pandera-modin-ray', max_pin="x.x.x") }}
        - {{ pin_subpackage('pandera-modin-dask', max_pin="x.x.x") }}
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.accessors.modin_accessor
        - pandera.typing.modin
      commands:
        - pip check

  - name: pandera-modin-ray
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - modin-ray
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.accessors.modin_accessor
        - pandera.typing.modin
      commands:
        - pip check

  - name: pandera-modin-dask
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - modin-dask
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.accessors.modin_accessor
        - pandera.typing.modin
      commands:
        - pip check

  - name: pandera-dask
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - dask
        - distributed
        # dask[dataframe]
        - dask
        - pandas
        - pyarrow
        # dask[array]
        - numpy
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.accessors.dask_accessor
        - pandera.typing.dask
      commands:
        - pip check

# skip pandera-mypy as we're missing scipy-stubs
#  - name: pandera-mypy
#    requirements:
#      run:
#        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
#        - mypy
#        - pandas-stubs
#        - scipy-stubs  # [py>=310]
#    test:
#      requires:
#        - pip
#      imports:
#        - pandera
#        - pandera.mypy
#      commands:
#        - pip check

  - name: pandera-fastapi
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - fastapi
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.typing.fastapi
      commands:
        - pip check

  - name: pandera-geopandas
    requirements:
      run:
        - {{ pin_subpackage('pandera-base', max_pin="x.x.x") }}
        - geopandas
        - shapely
    test:
      requires:
        - pip
      imports:
        - pandera
        - pandera.typing.geopandas
      commands:
        - pip check

about:
  home: https://github.com/pandera-dev/pandera
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: The open source framework for precision data testing
  description: |
    A simple, zero-configuration Python library to help you build
    confidence in the quality of your dataframe-like containers through
    data validation and property-based testing.
  doc_url: https://pandera.readthedocs.io
  dev_url: https://github.com/unionai-oss/pandera

extra:
  feedstock-name: pandera
  recipe-maintainers:
    - cosmicBboy
  # conda lint is not very smart about multi-output recipes
  skip-lints:
    # don't want a script file for single line command
    - wrong_output_script_key
    # as other outputs than pandera-base are here just for additional dependencies
    # they don't require build tools
    - missing_python_build_tool
    # python is a dependency of pandera-base only, as other outputs do not produce a real package
    - missing_python
    # wheel is only required for the pandera-base, as above
    - missing_wheel
    # to not spam PR with not reachable
    - invalid_url
